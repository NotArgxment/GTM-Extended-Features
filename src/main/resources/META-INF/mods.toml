modLoader = "javafml"
loaderVersion = "[47,)"
license = "${mod_license}"
issueTrackerURL = "https://github.com/NotArgxment/GTM-Extended-Features/issues"

[[mods]]
    modId = "${mod_id}"
    version = "${version}"
    displayName = "${mod_name}"
    displayURL = "${mod_url}"
    logoFile = "icon.png"
    credits = "GTCEu Modern Devs, Phoenixvine (PTF Dev), Herr Jolo (Chromatic Abberation Dev) & Witherschat (Universal Circuits Textures)"
    authors = "${mod_author}"
    description = "This mod providers additional content to enhance both packdev and end-user experience inside GTCEu Modern"

    [[dependencies.${mod_id}]]
        modId = "forge"
        mandatory = true
        versionRange = "[${forge_version},)"
        ordering = "NONE"
        side = "BOTH"
    [[dependencies.${mod_id}]]
        modId = "minecraft"
        mandatory = true
        versionRange = "[${minecraft_version},)"
        ordering = "NONE"
        side = "BOTH"
    [[dependencies.${mod_id}]]
        modId = "gtceu"
        mandatory = true
        versionRange = "[${gtceu_version},)"
        ordering = "AFTER"
        side = "BOTH"
